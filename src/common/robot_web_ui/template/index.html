<!doctype html>
<!-- robot_web_ui template: copy into a robot's web package (static/index.html) and add its pages.
     data-store: prefix of the browser's saved settings (layout, language) — one per robot. -->
<html lang="th" data-store="robot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1216">
<meta name="color-scheme" content="dark">
<title>Robot Web</title>
<script src="/ui/ui_en.js"></script>
<script src="/ui/i18n.js"></script>
<link rel="stylesheet" href="/ui/theme.css">
<link rel="stylesheet" href="/ui/ui.css">
<style>
  /* The robot's own windows. Drive page: two camera windows side by side, a drag bar between. */
  .pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  @media (max-width: 900px) { .pair { grid-template-columns: 1fr; } }
  body.desk main > section > .pair { flex: 1 1 0; min-height: 360px; display: flex; gap: 0; align-items: stretch; }
  body.desk .pair .view { aspect-ratio: auto; }
  @media (max-width: 700px), (max-height: 520px) and (max-width: 1100px) {
    #sec-drive, #sec-cams { display: none; }
  }
  body.desk #sec-drive, body.desk #sec-cams { display: none; }
</style>
</head>
<body data-page="drive">
<header>
  <h1 id="robot-name">Robot</h1>
  <!-- One button per page; data-page names it. The elements of a page carry data-pg="<page>". -->
  <nav class="jump" id="page-tabs">
    <button class="ptab on" data-page="drive">ขับ</button>
    <button class="ptab" data-page="cams">กล้อง</button>
    <button class="ptab" data-page="sys">ระบบ</button>
    <button id="win-reset" title="คืนขนาดหน้าต่างทั้งหมดในหน้านี้">↺ จัดหน้าต่าง</button>
  </nav>
  <span id="chip-conn" class="chip">กำลังเชื่อมต่อ…</span>
  <span id="chip-ctrl" class="chip">ไม่มีผู้ควบคุม</span>
  <span id="chip-estop" class="chip bad" hidden>E-STOP</span>
</header>

<main>
  <section>
    <h2 id="sec-drive" data-pg="drive">ขับ</h2>
    <div class="pair" id="pair" data-pg="drive">
      <div class="cam">
        <div class="cam-head">
          <div><select id="cam1-sel" title="เลือกกล้อง"></select></div>
          <button id="cam1-toggle">เปิด</button>
        </div>
        <div class="view" id="cam1-view"><span>ปิดอยู่</span></div>
      </div>
      <div class="cam">
        <div class="cam-head">
          <div><select id="cam2-sel" title="เลือกกล้อง"></select></div>
          <button id="cam2-toggle">เปิด</button>
        </div>
        <div class="view" id="cam2-view"><span>ปิดอยู่</span></div>
      </div>
    </div>

    <h2 id="sec-cams" data-pg="cams">กล้อง</h2>
    <div class="split-tools" data-pg="cams">
      <span class="hint">แบ่งจอ</span>
      <div class="seg" id="split-n">
        <button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button>
        <button data-n="4">4</button><button data-n="6">6</button><button data-n="9">9</button>
      </div>
      <button id="split-even" title="ทำให้ทุกช่องเท่ากัน">ช่องเท่ากัน</button>
      <span class="hint">ภาพ</span>
      <div class="seg" id="split-fit">
        <button data-fit="cover" title="ภาพเต็มช่องทุกช่อง ตัดขอบที่เกินออก">เต็มช่อง</button>
        <button data-fit="contain" title="เห็นทั้งภาพ มีแถบดำถ้าสัดส่วนไม่ตรงกับช่อง">ทั้งภาพ</button>
        <button data-fit="fill" title="ยืดภาพให้เต็มช่องพอดี (ภาพจะผิดสัดส่วน)">ยืด</button>
      </div>
    </div>
    <div id="grid" class="splitview" data-pg="cams"></div>

    <!-- Tablet/computer: the "sys" panels move here from the control panel on the system page -->
    <div id="sys-host" class="sys-host" data-pg="sys"></div>
  </section>

  <aside class="stack" id="ctrl-aside">
    <div class="side-bar">
      <span class="hint">แผงควบคุม</span>
      <button id="btn-side" title="ย้ายแผงควบคุมไปอีกฝั่ง">⇆ ย้ายไปซ้าย</button>
      <button id="btn-sheet-close">ซ่อน ▼</button>
    </div>
    <button id="btn-estop" class="estop">หยุดฉุกเฉิน (Space)</button>

    <!-- data-pg="drive": shown on every page (initPages always: ['drive']) -->
    <div class="panel stack" data-pg="drive">
      <h2>ควบคุม</h2>
      <div class="row">
        <button id="btn-take">รับสิทธิ์ควบคุม</button>
        <button id="btn-release" disabled>ปล่อยสิทธิ์</button>
      </div>
      <button id="btn-reset" hidden style="width:100%">ยกเลิก E-STOP</button>
      <div>
        <div class="row" style="justify-content:space-between">
          <span>ความเร็วสูงสุด</span><span id="speed-label">30%</span>
        </div>
        <input id="speed" type="range" min="10" max="100" step="5" value="30">
        <div class="hint" id="speed-hint"></div>
      </div>
      <div id="pad" class="disabled"><div id="knob"></div></div>
      <p class="hint">ลาก joystick หรือใช้ <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / ลูกศร ·
        ปล่อยมือแล้วหุ่นยนต์หยุด · ถ้าการเชื่อมต่อหลุด หุ่นยนต์จะหยุดเองภายใน <span id="timeout-label">0.5</span> วินาที</p>
    </div>

    <div class="panel" data-pg="sys">
      <h2>สถานะ</h2>
      <dl class="kv">
        <dt>ความเร็วเชิงเส้น</dt><dd id="out-linear">–</dd>
        <dt>ความเร็วเชิงมุม</dt><dd id="out-angular">–</dd>
      </dl>
    </div>
  </aside>
</main>

<div id="dock">
  <button id="dock-estop">หยุดฉุกเฉิน</button>
  <button id="dock-ctrl" aria-controls="ctrl-aside" aria-expanded="false">ควบคุม ▲</button>
  <!-- Phone only: one page at a time, switched from here -->
  <button class="tab on" data-page="drive"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>ขับ</button>
  <button class="tab" data-page="cams"><svg class="ic" viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="4"/></svg>กล้อง</button>
  <button class="tab" data-page="sys"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>ระบบ</button>
</div>

<div id="page-hint"><span></span><i></i></div>
<script src="/ui/core.js"></script>
<script>
(() => {
  const { $, streamView, splitPair, winify, setChip } = RobotUI;
  RobotUI.initShell();

  // Drive page: the two camera windows share the width; the bar between them is dragged.
  const pair = $('pair');
  [...pair.children].forEach(winify);
  splitPair(pair, pair.children[0], pair.children[1], 'x', 'pair', 0.5);

  RobotUI.initPages({
    home: 'drive', always: ['drive'],
    streams: { drive: ['cam1-toggle', 'cam2-toggle'] },   // closed when leaving the page, reopened on return
    defaults: { drive: ['cam1-toggle'] },
    deskHost: { sys: 'sys-host' },
  });

  let state = { control: 'none', estop: false };
  let limits = { max_linear: 0.5, max_angular: 1.0, command_timeout: 0.5 };

  // A camera window: a camera chosen in its select, on/off with its button (remembered).
  function camWindow(n, cameras, def) {
    const sel = $(`cam${n}-sel`), btn = $(`cam${n}-toggle`), show = streamView($(`cam${n}-view`));
    cameras.forEach(c => sel.add(new Option(c.label, c.name)));
    sel.value = RobotUI.store.get(`cam${n}`, def);
    if (sel.selectedIndex < 0 && cameras.length) sel.selectedIndex = Math.min(n - 1, cameras.length - 1);
    const on = () => btn.classList.contains('on');
    const apply = () => { show(on() ? sel.value : null); btn.textContent = on() ? 'ปิด' : 'เปิด'; };
    btn.onclick = () => { btn.classList.toggle('on'); apply(); btn.blur(); };
    sel.onchange = () => { RobotUI.store.set(`cam${n}`, sel.value); if (on()) apply(); sel.blur(); };
    btn.disabled = !cameras.length;
  }

  fetch('/api/info').then(r => r.json()).then(info => {
    limits = info.limits;
    if (info.name) { $('robot-name').textContent = info.name; document.title = info.name + ' Web'; }
    $('timeout-label').textContent = limits.command_timeout;
    updateSpeedHint();
    camWindow(1, info.cameras, info.cameras[0] && info.cameras[0].name);
    camWindow(2, info.cameras, info.cameras[1] && info.cameras[1].name);
    RobotUI.splitScreen(info.cameras, { page: 'cams' });
    if (document.body.dataset.page === 'drive' && info.cameras.length) $('cam1-toggle').click();
  });

  const { send } = RobotUI.connect('/ws', {
    onclose: () => { state = { control: 'none', estop: state.estop }; render(); },
    onmessage: (msg) => { if (msg.type === 'status') { state = msg; render(); } },
  });

  function render() {
    const me = state.control === 'me';
    $('btn-take').disabled = state.control !== 'none' || state.estop;
    $('btn-release').disabled = !me;
    $('pad').classList.toggle('disabled', !me);
    $('btn-reset').hidden = !state.estop;
    $('chip-estop').hidden = !state.estop;
    if (me) setChip('chip-ctrl', state.stale ? 'คุณควบคุมอยู่ (สัญญาณขาด)' : 'คุณควบคุมอยู่', state.stale ? 'warn' : 'ok');
    else if (state.control === 'other') setChip('chip-ctrl', 'มีคนอื่นควบคุมอยู่', 'warn');
    else setChip('chip-ctrl', 'ไม่มีผู้ควบคุม', '');
    const o = state.output;
    $('out-linear').textContent = o ? o.linear.toFixed(2) + ' m/s' : '–';
    $('out-angular').textContent = o ? o.angular.toFixed(2) + ' rad/s' : '–';
  }

  $('btn-take').onclick = () => send({ type: 'take' });
  $('btn-release').onclick = () => send({ type: 'release' });
  $('btn-estop').onclick = () => send({ type: 'estop' });
  $('btn-reset').onclick = () => send({ type: 'estop_reset' });

  const speed = $('speed');
  function updateSpeedHint() {
    $('speed-label').textContent = speed.value + '%';
    $('speed-hint').textContent = `≈ ${(limits.max_linear * speed.value / 100).toFixed(2)} m/s (สูงสุดที่ตั้งไว้ ${limits.max_linear} m/s)`;
  }
  speed.oninput = updateSpeedHint;

  const keys = RobotUI.driveKeys({ onEstop: () => send({ type: 'estop' }) });
  const pad = RobotUI.joystick($('pad'), $('knob'), () => state.control === 'me');

  // Drive loop, 20 Hz: also the heartbeat the server's watchdog waits for.
  setInterval(() => {
    if (state.control !== 'me') return;
    let x, y;   // x right, y forward, -1..1
    if (pad.active) { x = pad.x; y = pad.y; }
    else {
      x = (keys.has('right') ? 1 : 0) - (keys.has('left') ? 1 : 0);
      y = (keys.has('up') ? 1 : 0) - (keys.has('down') ? 1 : 0);
    }
    const k = speed.value / 100;
    send({ type: 'drive', linear: y * k, angular: -x * k });   // angular > 0 = turn left
  }, 50);
})();
</script>
</body>
</html>
